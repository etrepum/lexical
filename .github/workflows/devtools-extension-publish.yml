name: Publish DevTools extension to stores

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build version (a whole number, appended to the package version)'
        required: true
        default: 0
        type: number
      dry_run:
        description: 'Dry run (check store credentials without uploading)'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_owner == 'facebook'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24.x
      - name: Zip & submit to stores
        run: pnpm run publish-extension
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # The add-on's public slug on addons.mozilla.org. The store API also
          # accepts the numeric id or the GUID, but publish-browser-extension
          # strips the braces from a "{uuid}" GUID, which the API then reads as
          # a slug and answers with 404.
          FIREFOX_EXTENSION_ID: lexical-developer-tools
          FIREFOX_JWT_ISSUER: ${{ secrets.EXTENSION_FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.EXTENSION_FIREFOX_JWT_SECRET }}
          # Chrome Web Store API v2, authenticated with a service account that
          # has been added to the publisher in the developer dashboard. See
          # https://developer.chrome.com/docs/webstore/service-accounts
          # (API v1.1 and its OAuth refresh tokens stop working on
          # 2026-10-15.)
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: kgljmdocanfjckcgfpcpdoklodllfdpc
          CHROME_PUBLISHER_ID: ${{ secrets.EXTENSION_CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.EXTENSION_CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.EXTENSION_CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          BUILD_VERSION: ${{ inputs.build_version }}
