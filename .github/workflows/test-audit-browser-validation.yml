# Temporary fork-only validation for PR80; removed after recording results.
name: Test audit browser validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/lexical-playground/src/__tests__/browser/HTMLCopyAndPaste.test.ts'
      - '.github/workflows/test-audit-browser-validation.yml'

permissions:
  contents: read

jobs:
  browser:
    if: github.repository == 'etrepum/lexical' && github.head_ref == 'codex/reduce-test-ci-costs'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: macos-latest
            browser: webkit
    env:
      CI: true
      VITEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24.x'
      - uses: ./.github/actions/setup-playwright
        with:
          node-version: '24.x'
      - name: Validate migrated paste assertions in a real browser
        run: pnpm exec vitest run --project browser packages/lexical-playground/src/__tests__/browser/HTMLCopyAndPaste.test.ts
