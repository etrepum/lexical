# Temporary baseline telemetry on the validation branch; not part of PR80.
name: Test audit readiness baseline
on:
  push:
    branches: [codex/validate-test-ci-costs]
permissions:
  contents: read
concurrency:
  group: test-audit-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    if: github.repository == 'etrepum/lexical' && github.ref == 'refs/heads/codex/validate-test-ci-costs'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: macos-latest
            browser: webkit
    env:
      CI: true
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_EDITOR_MODE: rich-text
      E2E_PORT: 4000
      E2E_READINESS_PROBE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24.x'
      - uses: ./.github/actions/setup-playground
        with:
          node-version: '24.x'
      - uses: ./.github/actions/setup-playwright
        with:
          node-version: '24.x'
      - name: Measure baseline readiness without changing waits or slow motion
        run: >-
          pnpm exec playwright test --project=${{ matrix.browser }} --workers=2 --retries=0
          packages/lexical-playground/__tests__/e2e/Navigation.spec.mjs
          packages/lexical-playground/__tests__/e2e/Clear.spec.mjs
          packages/lexical-playground/__tests__/e2e/CodeBlockCaretScroll.spec.mjs
          packages/lexical-playground/__tests__/e2e/AutoScroll.spec.mjs
          packages/lexical-playground/__tests__/e2e/TextFormatting.spec.mjs
          packages/lexical-playground/__tests__/e2e/Images.spec.mjs
          packages/lexical-playground/__tests__/e2e/ShadowDOM.spec.mjs
          --grep 'can type and navigate several paragraphs|can clear the editor|Home, End and Enter|Pressing Enter scrolls new caret|triple click selection|change the font-size and font-family|Verifies image dimensions|Dimensionless SVG renders|populates shadowRoot.adoptedStyleSheets|characterData update on a'
