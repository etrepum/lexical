# Temporary validation branch only; not part of the final PR.
name: Test audit browser validation

on:
  push:
    branches: [codex/validate-test-ci-costs]

permissions:
  contents: read

concurrency:
  group: test-audit-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.repository == 'etrepum/lexical' && github.ref_name == 'codex/validate-test-ci-costs'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: macos-latest
            browser: webkit
    env:
      CI: true
      VITEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24.x'
      - uses: ./.github/actions/setup-playwright
        with:
          node-version: '24.x'
      - name: Validate migrated assertions in a real browser
        run: >-
          pnpm exec vitest run --project browser
          packages/lexical-playground/src/__tests__/browser/HTMLCopyAndPaste.test.ts
          packages/lexical-playground/src/__tests__/browser/CharacterLimit.test.ts
          packages/lexical-playground/src/__tests__/browser/TablesHTMLCopyAndPaste.test.ts
