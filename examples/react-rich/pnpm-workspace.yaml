# This example is a standalone project rather than a member of the Lexical
# monorepo workspace. Its own pnpm-workspace.yaml makes this directory the
# workspace root for a `pnpm install` run here, so pnpm never climbs into the
# monorepo above it, and it is where pnpm 11 reads the settings below from.
packages: []

# No dependency build script is approved here, which is how this project has
# always installed: they were reported and skipped under pnpm 10 and never
# ran. pnpm 11 fails the install unless each one is decided explicitly.
allowBuilds:
  esbuild: false

# Pin every Lexical package to the PR 9385 preview (npm reads package.json overrides).
overrides:
  "@lexical/a11y": "https://pkg.pr.new/facebook/lexical/@lexical/a11y@9385"
  "@lexical/clipboard": "https://pkg.pr.new/facebook/lexical/@lexical/clipboard@9385"
  "@lexical/code": "https://pkg.pr.new/facebook/lexical/@lexical/code@9385"
  "@lexical/code-core": "https://pkg.pr.new/facebook/lexical/@lexical/code-core@9385"
  "@lexical/code-prism": "https://pkg.pr.new/facebook/lexical/@lexical/code-prism@9385"
  "@lexical/code-shiki": "https://pkg.pr.new/facebook/lexical/@lexical/code-shiki@9385"
  "@lexical/compiler": "https://pkg.pr.new/facebook/lexical/@lexical/compiler@9385"
  "@lexical/devtools-core": "https://pkg.pr.new/facebook/lexical/@lexical/devtools-core@9385"
  "@lexical/dragon": "https://pkg.pr.new/facebook/lexical/@lexical/dragon@9385"
  "@lexical/eslint-plugin": "https://pkg.pr.new/facebook/lexical/@lexical/eslint-plugin@9385"
  "@lexical/extension": "https://pkg.pr.new/facebook/lexical/@lexical/extension@9385"
  "@lexical/fast-check": "https://pkg.pr.new/facebook/lexical/@lexical/fast-check@9385"
